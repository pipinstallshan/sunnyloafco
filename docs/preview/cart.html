<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cart drawer preview</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/sunnyloaf.css">
<style>
 :root{--font-heading--family:'Fraunces',serif;--font-body--family:'Figtree',sans-serif;--font-subheading--family:'Figtree',sans-serif}
 *{box-sizing:border-box}body{margin:0;background:rgba(42,35,28,.35);font-family:var(--font-body--family);color:var(--sl-charcoal);min-height:100vh}
 .drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--sl-milk);display:flex;flex-direction:column;box-shadow:-20px 0 60px -30px rgba(42,35,28,.6)}
 .dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--sl-wheat)}.dh h2{font-family:var(--font-heading--family);margin:0;font-size:1.3rem}
 .items{flex:1;overflow:auto;padding:16px 20px}
 .li{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--sl-wheat)}
 .li .th{width:64px;height:64px;border-radius:10px;background:#caa36f}.li strong{font-weight:600}.li .m{opacity:.7;font-size:.85rem}
 .sum{padding:16px 20px;border-top:1px solid var(--sl-wheat);background:var(--sl-warm-white)}
 .button{display:flex;align-items:center;justify-content:center;background:var(--sl-crust);color:var(--sl-milk);border-radius:12px;font-weight:600;text-decoration:none;padding:14px;margin-top:12px}
 .sl-upsell__add{background:var(--sl-wheat);color:var(--sl-charcoal);border:1px solid var(--sl-wheat);border-radius:10px;font-weight:600;padding:8px 14px;font-size:.8rem;cursor:pointer}
 .tot{display:flex;justify-content:space-between;font-weight:600;font-size:1.05rem;margin-top:10px}
</style></head>
<body class="sl-warm-shadows">
<aside class="drawer">
  <div class="dh"><h2>Your cart <span style="font-family:var(--font-body--family);font-size:.9rem;background:var(--sl-wheat);border-radius:100px;padding:2px 10px">2</span></h2><span>✕</span></div>
  <div class="items">
    <div class="li"><div class="th"></div><div><strong>Sunny Sill Window Perch</strong><div class="m">Oatmeal</div></div><div>$39.00</div></div>
    <div class="li"><div class="th"></div><div><strong>Soft Cloud Cat Bed</strong><div class="m">Sand</div></div><div>$38.00</div></div>
  </div>
  <div class="sum">
    <div class="sl-ship-bar"><p class="sl-ship-bar__text">You're $12.00 away from free US shipping ☀️</p><div class="sl-ship-bar__track"><span class="sl-ship-bar__fill" style="--sl-progress:76%"></span></div></div>
    <div class="sl-upsell"><p class="sl-upsell__title">Pairs well with a sunny afternoon</p><ul class="sl-upsell__list">
      <li class="sl-upsell__item"><span class="sl-upsell__thumb" style="background:#b98b58;border-radius:8px"></span><div><span class="sl-upsell__name">Windowsill Cushion</span><span class="sl-upsell__price">$29.00</span></div><button class="sl-upsell__add">Add</button></li>
    </ul></div>
    <div class="tot"><span>Subtotal</span><span>$77.00</span></div>
    <a class="button" href="#">Checkout</a>
  </div>
</aside>
</body></html>
