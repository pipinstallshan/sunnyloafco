<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hero preview</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/sunnyloaf.css">
<style>
 :root{--font-heading--family:'Fraunces',serif;--font-body--family:'Figtree',sans-serif;--font-subheading--family:'Figtree',sans-serif;--page-width:1280px;--page-margin:24px}
 *{box-sizing:border-box}body{margin:0;background:var(--sl-milk);color:var(--sl-charcoal);font-family:var(--font-body--family)}
 .button,.button-secondary{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;font-weight:600;text-decoration:none;padding:0 28px;min-height:48px;border:none;font-family:var(--font-body--family);cursor:pointer;font-size:1rem}
 .button{background:var(--sl-crust);color:var(--sl-milk)}
 .button-secondary{background:rgba(255,251,243,.92);color:var(--sl-charcoal)}
 .sl-hero__heading{color:#fffbf3}
</style></head>
<body class="sl-warm-shadows">
<section class="sl-hero sl-scheme--dark sl-hero--on-media" style="min-height:620px;--sl-hero-height:620px;--sl-hero-height-mobile:600px;--sl-overlay:.42;--sl-v-align:flex-end;--sl-v-align-mobile:flex-end;--sl-h-align:flex-start;--sl-text-align:left;--sl-focal:72% 55%;--sl-focal-mobile:66% 50%;">
  <div class="sl-hero__media"><img src="../../assets/sl-hero-cat.jpg" alt=""></div>
  <div class="sl-hero__overlay"></div>
  <div class="sl-hero__scrim" aria-hidden="true"></div>
  <span class="sl-hero__glow" aria-hidden="true"></span>
  <div class="sl-hero__inner sl-container">
    <div class="sl-hero__content">
      <p class="sl-eyebrow sl-hero__eyebrow">Sunny home goods for cats</p>
      <h1 class="sl-heading sl-hero__heading">A warmer spot for the cat who loafs</h1>
      <p class="sl-subheading sl-hero__tagline">Made for cats who loaf in the sun.</p>
      <p class="sl-subheading">Window perches, beds, and sunny-home essentials, chosen with care and shipped from the US.</p>
      <div class="sl-buttons">
        <a class="button" href="#">Shop the collection</a>
        <a class="button-secondary" href="#">Our story</a>
      </div>
      <ul class="sl-hero__trust" role="list">
        <li><span class="sl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M2.5 6.5h10v9h-10zM12.5 9.5h4l3 3v3h-7z"/><circle cx="6" cy="16.5" r="1.6"/><circle cx="16" cy="16.5" r="1.6"/></svg></span><span>Free US shipping over $49</span></li>
        <li><span class="sl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9A8 8 0 1 1 4 13"/><path d="M3.5 4.5V9H8"/></svg></span><span>Easy 30-day returns</span></li>
        <li><span class="sl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2.4v2.4M12 19.2v2.4M4.3 4.3l1.7 1.7M18 18l1.7 1.7M2.4 12h2.4M19.2 12h2.4M4.3 19.7l1.7-1.7M18 6l1.7-1.7"/></svg></span><span>Ships from the US</span></li>
      </ul>
    </div>
  </div>
</section>
</body></html>
