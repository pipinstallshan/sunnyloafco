<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>404 preview</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/sunnyloaf.css">
<style>
 :root{--font-heading--family:'Fraunces',serif;--font-body--family:'Figtree',sans-serif;--font-subheading--family:'Figtree',sans-serif;--page-width:900px;--page-margin:24px;--color-input-border:var(--sl-line);--color-input-background:var(--sl-warm-white);--color-input-text:var(--sl-charcoal)}
 *{box-sizing:border-box}body{margin:0;background:var(--sl-milk);color:var(--sl-charcoal);font-family:var(--font-body--family);min-height:100vh;display:grid;place-items:center}
 h1{font-family:var(--font-heading--family);font-weight:600;font-size:2.2rem;margin:0}
 .button,.button-secondary{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border-radius:12px;font-weight:600;text-decoration:none;padding:14px 24px;border:1px solid transparent;font-family:var(--font-body--family)}
 .button{background:var(--sl-crust);color:var(--sl-milk)}.button-secondary{background:var(--sl-wheat);color:var(--sl-charcoal)}
</style></head>
<body class="sl-warm-shadows">
<section class="sl-section sl-scheme--light"><div class="sl-container sl-404">
  <span class="sl-icon sl-404__icon" style="--sl-icon-size:120px;color:var(--sl-crust)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4.5 9.5 3.2 4.8c-.1-.5.4-.9.9-.6L8 6.3M19.5 9.5l1.3-4.7c.1-.5-.4-.9-.9-.6L16 6.3"/><path d="M4.5 10.5c0-2.2 3.4-4 7.5-4s7.5 1.8 7.5 4v2.8c0 3.5-3.4 5.9-7.5 5.9s-7.5-2.4-7.5-5.9z"/><path d="M9.3 12.2h.01M14.7 12.2h.01" stroke-width="2"/><path d="M12 14.2c-.7.8-1.8.8-2.5 0M12 14.2c.7.8 1.8.8 2.5 0"/></svg></span>
  <p class="sl-404__code">404</p>
  <h1 class="sl-heading">This page wandered off to find a sun patch.</h1>
  <p class="sl-subheading" style="margin-inline:auto">The link may be wrong, or the page has moved. Let's get you back to the warm spots.</p>
  <form class="sl-404__search" onsubmit="return false"><input class="sl-input" type="search" placeholder="Search for perches, beds, toys…"><button class="button"><span class="sl-icon" style="--sl-icon-size:20px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></span></button></form>
  <div class="sl-buttons" style="justify-content:center"><a class="button" href="#">Shop everything</a><a class="button-secondary" href="#">Back home</a></div>
</div></section>
</body></html>
