<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Password preview</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/sunnyloaf.css">
<style>
 :root{--font-heading--family:'Fraunces',serif;--font-body--family:'Figtree',sans-serif;--font-subheading--family:'Figtree',sans-serif;--color-input-border:var(--sl-line);--color-input-background:var(--sl-warm-white);--color-input-text:var(--sl-charcoal)}
 *{box-sizing:border-box}body{margin:0;background:var(--sl-milk);color:var(--sl-charcoal);font-family:var(--font-body--family)}
 .button{display:inline-flex;align-items:center;justify-content:center;background:var(--sl-crust);color:var(--sl-milk);border-radius:12px;font-weight:600;text-decoration:none;padding:0 28px;min-height:50px;border:none;font-family:var(--font-body--family);cursor:pointer}
</style></head>
<body class="sl-warm-shadows">
<div class="sl-password sl-scheme--light" style="--sl-logo-width:260px">
  <span class="sl-password__sun"></span>
  <div class="sl-password__inner">
    <img class="sl-password__logo" src="../../assets/lockup-stacked.png" alt="Sunny Loaf Co.">
    <h1 class="sl-password__heading">Opening soon ☀️</h1>
    <p class="sl-password__tagline">Made for cats who loaf in the sun.</p>
    <p class="sl-password__text">We're warming up the windowsills. Drop your email and we'll let you know the moment the shop is open.</p>
    <div class="sl-password__form"><div class="sl-signup__form-row"><input class="sl-input" type="email" placeholder="you@example.com"><button class="button">Notify me</button></div></div>
    <a class="sl-password__social" href="#"><span class="sl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="4"/><circle cx="16.6" cy="7.4" r="1.1" fill="currentColor" stroke="none"/></svg></span><span>Follow @sunnyloafco</span></a>
  </div>
</div>
</body></html>
